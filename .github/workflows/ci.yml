name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Smoke tests (Neovim ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.version }}
      - name: Run smoke tests
        run: nvim --headless --clean -u NONE --cmd "set rtp^=." -l tests/smoke.lua

  extras:
    name: Extras are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
      - name: Regenerate extras
        run: nvim --headless --clean -u NONE --cmd "set rtp^=." -l lua/winteriscoming/extra/init.lua
      - name: Fail if anything changed
        run: git diff --exit-code -- extras

  style:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ colors/ tests/
