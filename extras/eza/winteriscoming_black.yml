  selinux:
    colon: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    user: { foreground: "#7799bb", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    role: { foreground: "#c792ea", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    typ: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    range: { foreground: "#c792ea", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

