  selinux:
    colon: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    user: { foreground: "#37567c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    role: { foreground: "#7b30d0", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    typ: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    range: { foreground: "#7b30d0", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

