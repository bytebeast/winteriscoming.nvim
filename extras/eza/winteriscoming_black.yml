  modified: { foreground: "#219fd5", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  deleted: { foreground: "#ef5350", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  renamed: { foreground: "#7fdbca", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  typechange: { foreground: "#c792ea", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  ignored: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  conflicted: { foreground: "#f78c6c", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }

git_repo:
