# Winter is Coming Light for eza
# upstream: https://github.com/johnpapa/vscode-winteriscoming
# Save as theme.yml in eza's config directory:
#   Linux:  ~/.config/eza/theme.yml
#   macOS:  ~/Library/Application Support/eza/theme.yml
#   or anywhere, with EZA_CONFIG_DIR pointing at the folder that holds it

colourful: true

filekinds:
  normal: { foreground: "#002339", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  directory: { foreground: "#207bb8", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  symlink: { foreground: "#0097a7", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  pipe: { foreground: "#37567c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  block_device: { foreground: "#a8861c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  char_device: { foreground: "#a8861c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  socket: { foreground: "#37567c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  special: { foreground: "#c42fa4", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  executable: { foreground: "#07805e", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  mount_point: { foreground: "#2f7d70", is_underline: true, is_bold: false, is_dimmed: false, is_italic: false }

# read / write / execute keep one color each, so a column reads at a glance
perms:
  user_read: { foreground: "#a8861c", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  user_write: { foreground: "#de3d3b", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  user_execute_file: { foreground: "#07805e", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  user_execute_other: { foreground: "#07805e", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  group_read: { foreground: "#a8861c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  group_write: { foreground: "#de3d3b", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  group_execute: { foreground: "#07805e", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  other_read: { foreground: "#a8861c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  other_write: { foreground: "#de3d3b", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  other_execute: { foreground: "#07805e", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  special_user_file: { foreground: "#c42fa4", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  special_other: { foreground: "#c42fa4", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  attribute: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

# bigger files get warmer: bytes -> kilo -> mega -> giga -> huge
size:
  major: { foreground: "#37567c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  minor: { foreground: "#207bb8", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  number_byte: { foreground: "#002339", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  number_kilo: { foreground: "#207bb8", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  number_mega: { foreground: "#2f86d2", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  number_giga: { foreground: "#7b30d0", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  number_huge: { foreground: "#da5221", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  unit_byte: { foreground: "#4b6a8a", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  unit_kilo: { foreground: "#207bb8", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  unit_mega: { foreground: "#2f86d2", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  unit_giga: { foreground: "#7b30d0", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  unit_huge: { foreground: "#da5221", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

users:
  user_you: { foreground: "#002339", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  user_root: { foreground: "#de3d3b", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  user_other: { foreground: "#ae408b", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  group_yours: { foreground: "#37567c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  group_other: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  group_root: { foreground: "#de3d3b", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

links:
  normal: { foreground: "#0097a7", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  multi_link_file: { foreground: "#da5221", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

