  modified: { foreground: "#1857a4", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  deleted: { foreground: "#b31d28", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  renamed: { foreground: "#2f7d70", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  typechange: { foreground: "#7b30d0", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  ignored: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  conflicted: { foreground: "#da5221", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }

git_repo:
