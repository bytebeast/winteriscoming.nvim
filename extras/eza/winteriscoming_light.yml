  video: { foreground: "#c42fa4", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  music: { foreground: "#2f7d70", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  lossless: { foreground: "#2f7d70", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  crypto: { foreground: "#da5221", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  document: { foreground: "#002339", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  compressed: { foreground: "#de3d3b", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  temp: { foreground: "#5f7e97", is_italic: true, is_bold: false, is_dimmed: false, is_underline: false }
  compiled: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  build: { foreground: "#a8861c", is_underline: true, is_bold: false, is_dimmed: false, is_italic: false }
  source: { foreground: "#002339", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

punctuation: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
date: { foreground: "#7c2cbd", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
inode: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
blocks: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
header: { foreground: "#002339", is_bold: true, is_underline: true, is_dimmed: false, is_italic: false }
