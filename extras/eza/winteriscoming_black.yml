  crypto: { foreground: "#f78c6c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  document: { foreground: "#bce7ff", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  compressed: { foreground: "#ef5350", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  temp: { foreground: "#5f7e97", is_italic: true, is_bold: false, is_dimmed: false, is_underline: false }
  compiled: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  build: { foreground: "#ffcb6b", is_underline: true, is_bold: false, is_dimmed: false, is_italic: false }
  source: { foreground: "#bce7ff", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

punctuation: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
date: { foreground: "#d29ffc", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
inode: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
blocks: { foreground: "#5f7e97", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
